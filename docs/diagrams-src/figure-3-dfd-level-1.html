<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Figure 3 - DFD Level 1</title>
<style>
  body {
    margin: 0;
    background: #f6f8fb;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #1f2a37;
  }
  .wrap { width: 1200px; height: 800px; margin: 0 auto; }
  .title { font-size: 24px; font-weight: 600; text-anchor: middle; }
  .label { font-size: 15px; font-weight: 600; text-anchor: middle; }
  .small { font-size: 13px; text-anchor: middle; }
</style>
</head>
<body>
<div class="wrap">
<svg width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="DFD Level 1 major processes">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f6d8a"></path>
    </marker>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="20" fill="#ffffff" stroke="#d6e0ea" />
  <text x="600" y="90" class="title">Figure 3: DFD Level 1 - Major Processes</text>

  <rect x="90" y="150" width="220" height="90" rx="12" fill="#eaf2ff" stroke="#4f8ef7" />
  <text x="200" y="200" class="label">VS Code Extension</text>

  <rect x="90" y="300" width="220" height="90" rx="12" fill="#eaf2ff" stroke="#4f8ef7" />
  <text x="200" y="350" class="label">Web Dashboard</text>

  <rect x="90" y="450" width="220" height="90" rx="12" fill="#ffffff" stroke="#7aa2c8" />
  <text x="200" y="500" class="label">Google OAuth</text>

  <rect x="410" y="150" width="260" height="100" rx="14" fill="#ffffff" stroke="#4f8ef7" />
  <text x="540" y="200" class="label">1. Track Activity</text>

  <rect x="410" y="300" width="260" height="100" rx="14" fill="#ffffff" stroke="#4f8ef7" />
  <text x="540" y="350" class="label">2. Authenticate User</text>

  <rect x="410" y="450" width="260" height="100" rx="14" fill="#ffffff" stroke="#4f8ef7" />
  <text x="540" y="500" class="label">3. Store and Sync</text>

  <rect x="760" y="300" width="260" height="100" rx="14" fill="#ffffff" stroke="#4f8ef7" />
  <text x="890" y="350" class="label">4. Generate Analytics</text>

  <rect x="760" y="460" width="260" height="100" rx="16" fill="#ffffff" stroke="#7aa2c8" />
  <text x="890" y="515" class="label">MongoDB Atlas</text>

  <line x1="310" y1="195" x2="410" y2="195" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="360" y="178" class="small">Activity events</text>

  <line x1="310" y1="345" x2="410" y2="345" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="360" y="330" class="small">Login request</text>

  <line x1="310" y1="495" x2="410" y2="495" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="360" y="478" class="small">OAuth tokens</text>

  <line x1="670" y1="200" x2="760" y2="330" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="735" y="250" class="small">Session status</text>

  <line x1="670" y1="500" x2="760" y2="500" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="715" y="485" class="small">Write data</text>

  <line x1="890" y1="400" x2="890" y2="460" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="920" y="435" class="small">Read data</text>

  <line x1="760" y1="330" x2="670" y2="350" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="705" y="330" class="small">Auth status</text>

  <line x1="760" y1="330" x2="310" y2="345" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="540" y="320" class="small">Dashboard access</text>
</svg>
</div>
</body>
</html>
