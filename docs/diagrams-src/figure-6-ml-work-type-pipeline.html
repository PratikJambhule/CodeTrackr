<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Figure 6 - From a session to a group title</title>
<style>
  body { margin: 0; background: #f6f8fb; font-family: "Segoe UI", Arial, sans-serif; color: #1f2a37; }
  .wrap { width: 1200px; height: 660px; margin: 0 auto; }
  .title { font-size: 24px; font-weight: 600; text-anchor: middle; }
  .label { font-size: 17px; font-weight: 600; text-anchor: middle; }
  .small { font-size: 13.5px; text-anchor: middle; fill: #475569; }
  .tag { font-size: 12px; font-weight: 700; text-anchor: middle; letter-spacing: 0.06em; }
  .type { font-size: 13px; font-weight: 600; text-anchor: middle; }
</style>
</head>
<body>
<div class="wrap">
<svg width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Pipeline from coding activity to work type, persona and group titles">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f6d8a"></path>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="620" rx="20" fill="#ffffff" stroke="#d6e0ea" />
  <text x="600" y="68" class="title">Figure 6: From a coding session to a group title</text>

  <!-- 1. Extension -->
  <rect x="50" y="120" width="200" height="150" rx="12" fill="#eaf2ff" stroke="#4f8ef7" />
  <text x="150" y="160" class="label">VS Code extension</text>
  <text x="150" y="188" class="small">edits, reading time,</text>
  <text x="150" y="208" class="small">commands, file names,</text>
  <text x="150" y="228" class="small">Git, debug, focus</text>
  <text x="150" y="255" class="tag" fill="#64748b">ALREADY BUILT</text>

  <!-- 2. Session -->
  <rect x="300" y="120" width="200" height="150" rx="12" fill="#eaf2ff" stroke="#4f8ef7" />
  <text x="400" y="160" class="label">Session</text>
  <text x="400" y="188" class="small">10-minute records,</text>
  <text x="400" y="208" class="small">split at breaks of</text>
  <text x="400" y="228" class="small">more than 30 minutes</text>
  <text x="400" y="255" class="tag" fill="#64748b">ALREADY BUILT</text>

  <!-- 3. Attributes -->
  <rect x="550" y="120" width="200" height="150" rx="12" fill="#ffffff" stroke="#7aa2c8" stroke-dasharray="6 4" />
  <text x="650" y="160" class="label">18 attributes</text>
  <text x="650" y="188" class="small">how you write, what you</text>
  <text x="650" y="208" class="small">run, Git and focus,</text>
  <text x="650" y="228" class="small">file-name hints</text>
  <text x="650" y="255" class="tag" fill="#64748b">PHASE 1</text>

  <!-- 4. Work-type model -->
  <rect x="800" y="100" width="350" height="190" rx="14" fill="#fff7e6" stroke="#f59e0b" stroke-width="2" />
  <text x="975" y="138" class="label">Work-type model</text>
  <text x="975" y="162" class="small">rules first (Phase 1), ML model later (Phase 3)</text>
  <rect x="820" y="178" width="100" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" />
  <text x="870" y="198" class="type">DSA practice</text>
  <rect x="925" y="178" width="100" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" />
  <text x="975" y="198" class="type">Project</text>
  <rect x="1030" y="178" width="100" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" />
  <text x="1080" y="198" class="type">Debugging</text>
  <rect x="820" y="216" width="100" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" />
  <text x="870" y="236" class="type">Learning</text>
  <rect x="925" y="216" width="100" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" />
  <text x="975" y="236" class="type">Setup</text>
  <rect x="1030" y="216" width="100" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" />
  <text x="1080" y="236" class="type" fill="#64748b">Not sure</text>
  <text x="975" y="274" class="tag" fill="#b45309">THE ONLY PLACE ML IS USED</text>

  <line x1="250" y1="195" x2="296" y2="195" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="195" x2="546" y2="195" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="750" y1="195" x2="796" y2="195" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- User confirms -->
  <rect x="800" y="360" width="350" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" />
  <text x="975" y="396" class="label">You confirm with one tap</text>
  <text x="975" y="422" class="small">✓ or Change on the Insights page (20% asked blind)</text>
  <text x="975" y="442" class="small">These answers are what the model learns from</text>
  <line x1="975" y1="292" x2="975" y2="356" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Persona -->
  <rect x="300" y="360" width="200" height="130" rx="12" fill="#ffffff" stroke="#4f8ef7" />
  <text x="400" y="398" class="label">Persona</text>
  <text x="400" y="424" class="small">your mix over 30 days</text>
  <text x="400" y="444" class="small">"DSA Warrior" if DSA ≥ 50%</text>
  <text x="400" y="474" class="tag" fill="#64748b">RULE · PHASE 2</text>

  <!-- Group titles -->
  <rect x="550" y="360" width="200" height="130" rx="12" fill="#ffffff" stroke="#4f8ef7" />
  <text x="650" y="398" class="label">Group titles</text>
  <text x="650" y="424" class="small">each Monday, per type:</text>
  <text x="650" y="444" class="small">most minutes last week</text>
  <text x="650" y="474" class="tag" fill="#64748b">RULE · PHASE 2</text>

  <path d="M 860 292 C 860 330, 400 320, 400 356" fill="none" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 900 292 C 900 335, 650 325, 650 356" fill="none" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Where it shows -->
  <rect x="50" y="540" width="1100" height="70" rx="12" fill="#f8fafc" stroke="#d6e0ea" />
  <text x="600" y="570" class="label">Where you see it</text>
  <text x="600" y="594" class="small">Insights: work type per session and your persona · Groups: weekly titles, boards per work type · Leaderboard: tabs per work type · Dashboard: persona chip</text>
  <line x1="400" y1="490" x2="400" y2="536" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="650" y1="490" x2="650" y2="536" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
</svg>
</div>
</body>
</html>
