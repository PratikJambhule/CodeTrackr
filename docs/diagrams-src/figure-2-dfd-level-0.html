<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Figure 2 - DFD Level 0</title>
<style>
  body {
    margin: 0;
    background: #f6f8fb;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #1f2a37;
  }
  .wrap {
    width: 1200px;
    height: 800px;
    margin: 0 auto;
  }
  .title { font-size: 24px; font-weight: 600; text-anchor: middle; }
  .label { font-size: 16px; font-weight: 600; text-anchor: middle; }

</style>
</head>
<body>
<div class="wrap">

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f6d8a"></path>
    </marker>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="20" fill="#ffffff" stroke="#d6e0ea" />
  <text x="600" y="90" class="title">Figure 2: DFD Level 0 - Context Diagram</text>

  <rect x="120" y="240" width="220" height="110" rx="12" fill="#eaf2ff" stroke="#4f8ef7" />
  <text x="230" y="290" class="label">Developer</text>
  <text x="230" y="315" class="small">Uses extension and</text>
  <text x="230" y="335" class="small">dashboard</text>

  <rect x="860" y="170" width="240" height="110" rx="12" fill="#eaf2ff" stroke="#4f8ef7" />

  <text x="980" y="400" class="small">Analytics and goals</text>

  <rect x="860" y="470" width="240" height="110" rx="12" fill="#ffffff" stroke="#7aa2c8" />
  <text x="980" y="525" class="label">Google OAuth</text>
  <text x="980" y="550" class="small">Login tokens</text>

  <ellipse cx="520" cy="360" rx="170" ry="120" fill="#ffffff" stroke="#4f8ef7" stroke-width="2" />
  <text x="520" y="350" class="label">CodeTrackr System</text>
  <text x="520" y="375" class="small">Extension + Backend + UI</text>

  <line x1="340" y1="295" x2="350" y2="310" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="350" y1="330" x2="340" y2="350" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />

  <line x1="860" y1="225" x2="690" y2="300" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="690" y1="320" x2="860" y2="250" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />

  <line x1="860" y1="375" x2="690" y2="360" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="690" y1="385" x2="860" y2="395" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />

  <line x1="860" y1="525" x2="690" y2="420" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="690" y1="445" x2="860" y2="545" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />

  <text x="420" y="275" class="small">Login, view stats</text>
  <text x="760" y="210" class="small">Activity data</text>
  <text x="760" y="395" class="small">Reports</text>
  <text x="760" y="505" class="small">Auth tokens</text>

</div>

</html>
