<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Figure 7 - How the model gets its labels</title>
<style>
  body { margin: 0; background: #f6f8fb; font-family: "Segoe UI", Arial, sans-serif; color: #1f2a37; }
  .wrap { width: 1200px; height: 620px; margin: 0 auto; }
  .title { font-size: 24px; font-weight: 600; text-anchor: middle; }
  .num { font-size: 18px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
  .label { font-size: 17px; font-weight: 600; text-anchor: middle; }
  .small { font-size: 13.5px; text-anchor: middle; fill: #475569; }
  .note { font-size: 14px; text-anchor: middle; fill: #b45309; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
<svg width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Loop showing how confirmed labels train the model">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f6d8a"></path>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="580" rx="20" fill="#ffffff" stroke="#d6e0ea" />
  <text x="600" y="68" class="title">Figure 7: How the model gets its right answers</text>

  <!-- Step 1 -->
  <rect x="80" y="120" width="300" height="130" rx="12" fill="#eaf2ff" stroke="#4f8ef7" />
  <circle cx="110" cy="150" r="17" fill="#4f8ef7" />
  <text x="110" y="156" class="num">1</text>
  <text x="245" y="160" class="label">The app guesses</text>
  <text x="230" y="192" class="small">rules today, the model later:</text>
  <text x="230" y="214" class="small">"this looked like DSA practice"</text>

  <!-- Step 2 -->
  <rect x="820" y="120" width="300" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" />
  <circle cx="850" cy="150" r="17" fill="#10b981" />
  <text x="850" y="156" class="num">2</text>
  <text x="985" y="160" class="label">You confirm</text>
  <text x="970" y="192" class="small">tap ✓ or Change</text>
  <text x="970" y="214" class="small">1 in 5 questions show no guess</text>

  <!-- Step 3 -->
  <rect x="820" y="370" width="300" height="130" rx="12" fill="#eaf2ff" stroke="#4f8ef7" />
  <circle cx="850" cy="400" r="17" fill="#4f8ef7" />
  <text x="850" y="406" class="num">3</text>
  <text x="985" y="410" class="label">Answers are saved</text>
  <text x="970" y="442" class="small">with the session's 18 numbers</text>
  <text x="970" y="464" class="small">(never file or project names)</text>

  <!-- Step 4 -->
  <rect x="80" y="370" width="300" height="130" rx="12" fill="#fff7e6" stroke="#f59e0b" stroke-width="2" />
  <circle cx="110" cy="400" r="17" fill="#f59e0b" />
  <text x="110" y="406" class="num">4</text>
  <text x="245" y="410" class="label">Train and test</text>
  <text x="230" y="442" class="small">test on people it never saw;</text>
  <text x="230" y="464" class="small">ship only if it beats the rules</text>

  <line x1="380" y1="185" x2="816" y2="185" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="970" y1="250" x2="970" y2="366" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="820" y1="435" x2="384" y2="435" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="230" y1="370" x2="230" y2="254" stroke="#4f6d8a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Centre -->
  <text x="600" y="290" class="label">Better guesses → fewer corrections</text>
  <text x="600" y="316" class="small">Personas and group titles bring people back,</text>
  <text x="600" y="338" class="small">which means more sessions and more answers</text>

  <text x="600" y="555" class="note">Why blind questions? If the guess is always shown, people tap ✓ on it — and the model learns to copy the rules.</text>
</svg>
</div>
</body>
</html>
