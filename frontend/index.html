<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeTrackr: your coding hours, on the scoreboard</title>
    <meta name="description" content="CodeTrackr times your coding in VS Code on its own. Make a group with your friends and see who put in the hours this week." />
    <meta name="theme-color" content="#12101C" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One stylesheet per family: if one family ever fails to load, the others still do. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&display=swap" />
    <script>
      // Apply the saved theme before the first paint, so the page never flashes the
      // wrong colours. Dark unless the visitor chose light (or "system" + a light OS).
      (function () {
        try {
          var t = localStorage.getItem('codetrackr.theme');
          var light = t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
